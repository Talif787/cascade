[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascade"
version = "0.1.0"
description = "Control plane for the Cascade real-time streaming data platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Cascade Platform Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    # Security floors for transitive packages (see SECURITY.md and the release-image scan).
    "msgpack>=1.2.1",
    "setuptools>=78.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
cascade = "cascade.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: tests that require a live database"]

[tool.coverage.run]
source = ["src/cascade"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N818: domain exceptions use ubiquitous-language names (for example
# InvalidPipelineName); the base classes DomainError and ValidationError
# already carry the error semantics, so the Error suffix is intentionally omitted.
ignore = ["A003", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
disallow_untyped_decorators = false
